name: BARAKA Android build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: flutter create --platforms=android --project-name baraka --org uz.baraka .

      - name: Configure Google Services Gradle plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          candidates = [Path("android/app/build.gradle"), Path("android/app/build.gradle.kts")]
          app_gradle = next((p for p in candidates if p.exists()), None)
          if app_gradle is None:
              raise SystemExit("Android app Gradle file was not generated")
          content = app_gradle.read_text()
          plugin = "com.google.gms.google-services"
          if plugin not in content:
              if 'id "com.android.application"' in content:
                  content = content.replace(
                      'id "com.android.application"',
                      'id "com.android.application"\\n    id "com.google.gms.google-services" version "4.4.2"',
                      1,
                  )
              elif 'id("com.android.application")' in content:
                  content = content.replace(
                      'id("com.android.application")',
                      'id("com.android.application")\\n    id("com.google.gms.google-services") version "4.4.2"',
                      1,
                  )
              else:
                  raise SystemExit("Could not locate Android application plugin declaration")
              app_gradle.write_text(content)
          PY
          test -f android/app/google-services.json

      - name: Remove generated placeholder test
        run: rm -f test/widget_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Flutter code
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: baraka-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
