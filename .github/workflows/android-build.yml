name: BARAKA Android build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/auth-validation
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: flutter create --platforms=android --project-name baraka --org uz.baraka .

      - name: Configure Google Services Gradle plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path

          candidates = [Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")]
          app_gradle = next((p for p in candidates if p.exists()), None)
          if app_gradle is None:
              raise SystemExit("Android app Gradle file was not generated")

          content = app_gradle.read_text()
          plugin_id = "com.google.gms.google-services"
          if plugin_id not in content:
              if app_gradle.suffix == ".kts":
                  needle = 'id("com.android.application")'
                  replacement = needle + '\\n    id("com.google.gms.google-services") version "4.4.2"'
              else:
                  needle = "id 'com.android.application'"
                  replacement = needle + '\\n    id "com.google.gms.google-services" version "4.4.2"'
              if needle not in content:
                  raise SystemExit("Could not locate Android application plugin declaration")
              content = content.replace(needle, replacement, 1)
              app_gradle.write_text(content)
          PY
          test -f android/app/google-services.json

      - name: Remove generated placeholder test
        run: rm -f test/widget_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Flutter code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Show debug signing fingerprints
        run: |
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android -keypass android | grep -E 'SHA1:|SHA256:'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: baraka-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
